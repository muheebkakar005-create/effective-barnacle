<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD" />
      <stop offset="25%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#C59B4B" />
      <stop offset="75%" stop-color="#EAC786" />
      <stop offset="100%" stop-color="#9E742A" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1815" />
      <stop offset="50%" stop-color="#0E0D0B" />
      <stop offset="100%" stop-color="#1F1B14" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Shield / Crest Base -->
  <path d="M 200,20 
           C 310,20 365,60 365,180 
           C 365,275 285,340 200,380 
           C 115,340 35,275 35,180 
           C 35,60 90,20 200,20 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="5" 
        filter="url(#goldGlow)" />

  <!-- Inner Double Filigree Border -->
  <path d="M 200,32 
           C 295,32 350,68 350,180 
           C 350,265 278,328 200,364 
           C 122,328 50,265 50,180 
           C 50,68 105,32 200,32 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.8" 
        stroke-dasharray="6,3" 
        opacity="0.85" />

  <!-- Royal Imperial Crown at Top -->
  <g transform="translate(140, 48) scale(0.6)" fill="url(#goldGrad)">
    <!-- Crown base -->
    <rect x="25" y="70" width="150" height="12" rx="3" />
    <circle cx="45" cy="76" r="3" fill="#1A1815" />
    <circle cx="75" cy="76" r="3" fill="#1A1815" />
    <circle cx="100" cy="76" r="3.5" fill="#1A1815" />
    <circle cx="125" cy="76" r="3" fill="#1A1815" />
    <circle cx="155" cy="76" r="3" fill="#1A1815" />
    <!-- Crown peaks -->
    <path d="M 25,70 L 20,28 L 55,50 L 100,10 L 145,50 L 180,28 L 175,70 Z" />
    <!-- Crown jewels -->
    <circle cx="20" cy="24" r="5" />
    <circle cx="55" cy="46" r="4.5" />
    <circle cx="100" cy="7" r="7" />
    <circle cx="145" cy="46" r="4.5" />
    <circle cx="180" cy="24" r="5" />
    <!-- Cross on center orb -->
    <path d="M 97, -3 L 103, -3 M 100, -6 L 100, 0" stroke="url(#goldGrad)" stroke-width="2" />
  </g>

  <!-- Ornate Laurel Leaves / Wings on sides -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.9">
    <!-- Left laurel sprig -->
    <path d="M 72,130 C 65,165 70,210 95,250" />
    <path d="M 72,145 C 60,140 62,130 72,135" fill="url(#goldGrad)" />
    <path d="M 70,175 C 56,172 58,160 70,165" fill="url(#goldGrad)" />
    <path d="M 75,205 C 62,206 65,194 77,196" fill="url(#goldGrad)" />
    <path d="M 88,235 C 75,238 78,226 90,227" fill="url(#goldGrad)" />

    <!-- Right laurel sprig -->
    <path d="M 328,130 C 335,165 330,210 305,250" />
    <path d="M 328,145 C 340,140 338,130 328,135" fill="url(#goldGrad)" />
    <path d="M 330,175 C 344,172 342,160 330,165" fill="url(#goldGrad)" />
    <path d="M 325,205 C 338,206 335,194 323,196" fill="url(#goldGrad)" />
    <path d="M 312,235 C 325,238 322,226 310,227" fill="url(#goldGrad)" />
  </g>

  <!-- Monogram Center: Interlocking / Regal 'S K' -->
  <g id="skMonogram" transform="translate(200, 185)" text-anchor="middle">
    <!-- Drop shadow for letters -->
    <text x="1" y="16" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
          font-size="112" 
          font-weight="900" 
          letter-spacing="4" 
          fill="#000000" 
          opacity="0.8">SK</text>

    <!-- Golden Metallic Monogram Text -->
    <text x="0" y="14" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
          font-size="112" 
          font-weight="900" 
          letter-spacing="4" 
          fill="url(#goldGrad)" 
          stroke="#4A3510" 
          stroke-width="1.5">SK</text>
  </g>

  <!-- Ribbon / Banner for 'BRAND' -->
  <g transform="translate(0, 245)">
    <!-- Banner Ribbon Background -->
    <path d="M 90,16 L 110,-2 L 110,34 Z" fill="#7A5618" />
    <path d="M 310,16 L 290,-2 L 290,34 Z" fill="#7A5618" />
    
    <path d="M 100,0 
             L 300,0 
             C 305,0 308,4 308,8 
             L 308,24 
             C 308,28 305,32 300,32 
             L 100,32 
             C 95,32 92,28 92,24 
             L 92,8 
             C 92,4 95,0 100,0 Z" 
          fill="url(#goldGrad)" 
          stroke="#5C4112" 
          stroke-width="1.5" 
          filter="url(#goldGlow)" />
    
    <!-- Banner Text: BRAND -->
    <text x="200" y="22" 
          font-family="'Plus Jakarta Sans', 'Arial', sans-serif" 
          font-size="22" 
          font-weight="900" 
          letter-spacing="8" 
          fill="#12100C" 
          text-anchor="middle">BRAND</text>
  </g>

  <!-- Founder Subtext: SAMI KHAN -->
  <g transform="translate(0, 310)">
    <!-- Left & Right Wing lines with diamond -->
    <line x1="85" y1="-5" x2="135" y2="-5" stroke="url(#goldGrad)" stroke-width="1.5" />
    <polygon points="140,-5 143,-8 146,-5 143,-2" fill="url(#goldGrad)" />

    <text x="200" y="0" 
          font-family="'Plus Jakarta Sans', 'Cinzel', 'Arial', sans-serif" 
          font-size="16" 
          font-weight="700" 
          letter-spacing="5" 
          fill="url(#goldGrad)" 
          text-anchor="middle">SAMI KHAN</text>

    <polygon points="254,-5 257,-8 260,-5 257,-2" fill="url(#goldGrad)" />
    <line x1="265" y1="-5" x2="315" y2="-5" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Quetta Heritage Subtitle -->
    <text x="200" y="22" 
          font-family="'Plus Jakarta Sans', 'Arial', sans-serif" 
          font-size="10.5" 
          font-weight="600" 
          letter-spacing="3" 
          fill="#E5C193" 
          opacity="0.9" 
          text-anchor="middle">QUETTA • BALOCHI DOCH</text>
  </g>

  <!-- Bottom Accent Diamond -->
  <polygon points="200,345 204,352 200,359 196,352" fill="url(#goldGrad)" />
</svg>
